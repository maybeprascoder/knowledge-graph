    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"attr": "NP", "color": "#97c2fc", "id": "thirsty crow", "label": "thirsty crow", "shape": "dot", "size": 10}, {"attr": "NP", "color": "#97c2fc", "id": "water", "label": "water", "shape": "dot", "size": 10}, {"attr": "NP", "color": "#97c2fc", "id": "he", "label": "he", "shape": "dot", "size": 10}, {"attr": "NP", "color": "#97c2fc", "id": "pitcher", "label": "pitcher", "shape": "dot", "size": 10}, {"attr": "NP", "color": "#97c2fc", "id": "long time", "label": "long time", "shape": "dot", "size": 10}, {"attr": "NP", "color": "#97c2fc", "id": "garden", "label": "garden", "shape": "dot", "size": 10}, {"attr": "NP", "color": "#97c2fc", "id": "small stones", "label": "small stones", "shape": "dot", "size": 10}, {"attr": "NP", "color": "#97c2fc", "id": "clever crow", "label": "clever crow", "shape": "dot", "size": 10}, {"attr": "NP", "color": "#97c2fc", "id": "plan", "label": "plan", "shape": "dot", "size": 10}, {"attr": "NP", "color": "#97c2fc", "id": "crow", "label": "crow", "shape": "dot", "size": 10}]);
                  edges = new vis.DataSet([{"from": "thirsty crow", "label": "search_for", "relation": "search_for", "to": "water", "width": 1}, {"from": "he", "label": "see", "relation": "see", "to": "pitcher", "width": 1}, {"from": "he", "label": "see_after", "relation": "see_after", "to": "long time", "width": 1}, {"from": "he", "label": "see_in", "relation": "see_in", "to": "garden", "width": 1}, {"from": "he", "label": "pick", "relation": "pick", "to": "small stones", "width": 1}, {"from": "clever crow", "label": "think_of", "relation": "think_of", "to": "plan", "width": 1}, {"from": "crow", "label": "drink", "relation": "drink", "to": "water", "width": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
