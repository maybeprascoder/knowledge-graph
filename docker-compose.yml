version: '3.8'

services:
  neo4j:
    image: neo4j:5.15-community
    container_name: kg_neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/kgdemo123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "kgdemo123", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  api:
    build: .
    container_name: kg_api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=neo4j123
      - OLLAMA_MODEL=llama3.2
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - CONCUR_CSV_DIR=/app/data
    volumes:
      - ../:/app/data:ro  # Mount CSV files from parent directory
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
